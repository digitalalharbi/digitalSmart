name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue builds each pull request on top of main *and* the ones queued ahead of it,
  # then merges only if that combined result is green. Without this trigger the checks never run
  # on the combination, so every queued entry would sit waiting for a status that cannot arrive.
  merge_group:

# A superseded run on the same branch is wasted compute.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '24'

jobs:
  # First, and everything waits on it: no workflow may invoke a model, hold a secret or run on a schedule.
  # Owner decision, 2026-10-19 — see CLAUDE.md "Execution policy". No secrets are used anywhere in this file.
  governance:
    name: Governance (no model, no secret, no schedule)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML for the guard
        run: python3 -m pip install --quiet pyyaml
      - name: The guard fails on what it forbids
        run: bash scripts/governance/test-no-paid-model.sh
      - name: The workflows pass the guard
        run: bash scripts/governance/no-paid-model.sh

  backend:
    name: Backend (Pint, PHPStan, Pest)
    runs-on: ubuntu-latest
    needs: [governance]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: digitalsmart_test
          POSTGRES_USER: digitalsmart
          POSTGRES_PASSWORD: digitalsmart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U digitalsmart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style (Pint)
        run: php vendor/bin/pint --test

      - name: Static analysis (PHPStan level 8)
        run: php vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests (architecture, unit, feature)
        # The architecture suite analyses the whole codebase; 128M is not enough.
        #
        # One PHPUnit process per core. Each gets its own database (digitalsmart_test_test_1 … _N, created and
        # migrated by Laravel's parallel-testing support with the service's own superuser), so no test shares a
        # transaction with another. Serial, this step took 10 m 57 s on run 43239350172 and was most of the job.
        run: php -d memory_limit=512M vendor/bin/pest --ci --parallel --processes="$(nproc)"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: digitalsmart_test
          DB_USERNAME: digitalsmart
          DB_PASSWORD: digitalsmart
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

  frontend:
    name: Frontend (TypeScript, ESLint, Vitest, build)
    runs-on: ubuntu-latest
    needs: [governance]
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (strict)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Format check (Prettier)
        run: npm run format:check

      - name: Unit and component tests
        run: npm run test

      - name: Production build
        run: npm run build

  # The end-to-end suite in shards. It needs a migrated API and a built SPA, and it builds both itself in its own
  # steps — so it waits on nothing but the governance gate. Waiting on `backend` put the whole twelve-minute Pest
  # run in front of it (run 43239350172: backend 12 m 51 s, then e2e 26 m 6 s, total 39 m), and waiting on
  # `frontend` would do the same for four minutes; a type error fails both the Frontend check and this job's own
  # build, so nothing is lost by running them side by side.
  #
  # Not a required check (docs/CI_STATUS.md) — the merge waits on Governance, Backend and Frontend. The aggregating
  # `e2e` job below keeps the one status line this had before.
  e2e-shard:
    name: End-to-end shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    needs: [governance]
    # A browser install that is network-bound (one run spent half an hour in apt) is the reason for the margin:
    # a timeout cancels the job and reads as a failure.
    timeout-minutes: 30

    strategy:
      # Every shard reports; the aggregating job below fails if any of them did.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: digitalsmart
          POSTGRES_USER: digitalsmart
          POSTGRES_PASSWORD: digitalsmart
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U digitalsmart"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_pgsql, pgsql, bcmath, intl, zip, sodium
          coverage: none
          tools: composer:v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The same key as the backend job, so whichever job ran first has already paid for the install.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - name: Start the API
        working-directory: backend
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          # The whole suite's traffic lands in one per-IP bucket sized for a
          # single person, so the per-IP budgets are raised for this run only.
          # Production keeps the defaults, and the per-account login limit —
          # the one that matters against brute force — still applies.
          {
            echo "RATE_LIMIT_AUTH=500"
            echo "RATE_LIMIT_API_GUEST=1000"
            echo "RATE_LIMIT_API_USER=1000"
            echo "RATE_LIMIT_HEALTH=1000"
            # The landing page takes requests for an account for the demo workspace, so the flow is exercised.
            echo "ACCESS_REQUESTS_WORKSPACE_SLUG=demo-smart-code"
            echo "RATE_LIMIT_ACCESS_REQUESTS=500"
            # Cheap password hashing for this run only, as scripts/e2e.sh does and for the same reason: every
            # test signs in, one browser worker per core now does so at once, and at production rounds a burst
            # of sign-ins fills the accept queue and the browser reports the server as unreachable. Seeded
            # before the server starts, so the seed and the server agree.
            echo "BCRYPT_ROUNDS=4"
          } >> .env
          php artisan key:generate
          php artisan migrate --force
          # The end-to-end suite signs in as the seeded demo roles, so a
          # permission regression fails here as well as in the backend tests.
          php artisan db:seed --force
          # PHP's built-in server answers one request at a time unless told to fork; `--no-reload` is what lets
          # it (scripts/e2e.sh explains both). Eight is headroom for one browser worker per core.
          PHP_CLI_SERVER_WORKERS=8 nohup php artisan serve --host=127.0.0.1 --port=8001 --no-reload > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/api/health || true)
            if [ "$code" = "200" ]; then echo "API ready"; exit 0; fi
            sleep 2
          done
          echo "API did not become healthy:"; cat /tmp/api.log; exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # The three browsers are kept between runs, keyed on the Playwright version the lockfile pins: a new
      # Playwright brings new browser builds and misses the cache, anything else hits it. The apt packages the
      # browsers need are not in the cache and are installed every run.
      - name: Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers and their packages
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Install the browsers' packages
        if: steps.browsers.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium webkit firefox

      - name: Run end-to-end tests
        working-directory: frontend
        # One browser worker per core, against the eight-worker API above. Playwright builds and serves the SPA
        # itself (playwright.config.ts, webServer). This shard runs its share of every project's tests.
        run: E2E_WORKERS="$(nproc)" npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: frontend/playwright-report
          retention-days: 7

  # One status line for the whole suite, under the name the suite has always reported with.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [e2e-shard]
    if: ${{ !cancelled() }}
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        run: |
          echo "Shards: ${{ needs.e2e-shard.result }}"
          [ "${{ needs.e2e-shard.result }}" = "success" ]
